name: dsh_mobile_app
description: "Mobile client for the DeepSeek Harness dsh web server."
publish_to: 'none'

version: 1.0.97+97

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dsh_dart_sdk:
    path: ../dsh_dart_sdk
  flutter_secure_storage: ^9.2.0
  flutter_markdown: ^0.7.0
  image_picker: ^1.1.2
  mobile_scanner: ^7.4.0
  url_launcher: ^6.3.0
  record: 6.2.1
  audioplayers: ^6.1.0
  flutter_pcm_sound: ^3.3.3
  path_provider: ^2.1.6

dependency_overrides:
  # record 5.2.1's platform matrix is broken on Linux (record_linux 0.7.2
  # predates the interface's startStream member that record_android 1.5.2
  # requires). record 6.2.1's matrix is self-consistent; pin it wholesale so
  # pub cannot drift back into the broken 5.x line.
  record_android: 1.5.2
  record_darwin: 1.2.2
  record_web: 1.3.0
  record_windows: 1.0.7
  record_linux: 1.3.1
  record_platform_interface: 1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
  assets:
    # Talk-mascot sprite packs (layers + manifest.json per pack); see
    # lib/widgets/mascot/. Asset directories are not bundled recursively, so
    # each pack directory needs its own entry.
    - assets/mascots/deepseek/
